name: streamload_client
description: "Streamload v3 desktop client (Flutter)"
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Local DB
  drift: ^2.18.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24

  # Secure storage / preferences
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # HTTP
  dio: ^5.7.0
  dio_cookie_manager: ^3.2.0
  cookie_jar: ^4.0.8

  # Immutable models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^7.0.0
  lucide_icons: ^0.257.0

  # Plugin runtime
  flutter_js: ^0.8.1
  html: ^0.15.5
  pointycastle: ^3.9.1
  crypto: ^3.0.5

  # HLS playback
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_macos_video: ^1.1.4
  # iOS native libmpv backend — without this the iOS build ships no
  # Mpv.framework and playback fails ("Cannot find Mpv.framework/Mpv").
  media_kit_libs_ios_video: ^1.1.4
  # Configures the iOS AVAudioSession to "playback" so the player's audio is
  # actually audible (and plays through the silent switch), not muted.
  audio_session: ^0.1.25
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  intl: ^0.19.0

  # WebView for hero trailer (YouTube IFrame Player API). macOS + iOS use
  # the wkwebview backend; Android uses the platform-bundled WebView.
  webview_flutter: ^4.10.0
  webview_flutter_wkwebview: ^3.16.0
  webview_flutter_android: ^4.0.0

  # App version string for the Settings "About" section (Phase H2). Direct
  # dep so we can call PackageInfo.fromPlatform(); previously transitive
  # through other plugins, now used explicitly.
  package_info_plus: ^8.0.0
  liquid_glass_renderer: 0.2.0-dev.4
  native_liquid_glass: ^0.2.7
  path_drawing: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  http: ^1.2.2

flutter:
  uses-material-design: true

  assets:
    # Bundled login poster art — shipped with the app so the login wall is
    # always populated, offline, with zero network calls.
    - assets/login_posters/
