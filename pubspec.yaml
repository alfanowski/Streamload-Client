name: streamload_client
description: "Streamload v3 desktop client (Flutter)"
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Local DB
  drift: ^2.18.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24

  # Secure storage / preferences
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # HTTP
  dio: ^5.7.0
  dio_cookie_manager: ^3.2.0
  cookie_jar: ^4.0.8

  # Immutable models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^7.0.0
  lucide_icons: ^0.257.0

  # Plugin runtime
  flutter_js: ^0.8.1
  html: ^0.15.5
  pointycastle: ^3.9.1
  crypto: ^3.0.5

  # HLS playback
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_macos_video: ^1.1.4
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  http: ^1.2.2

flutter:
  uses-material-design: true
